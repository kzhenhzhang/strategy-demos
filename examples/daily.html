<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>日常检视 · scott王</title>
  <link rel="stylesheet" href="../assets/portal.css" />
</head>
<body>
<nav class="nav" aria-label="主导航">
  <div class="nav-inner">
    <a href="../index.html" class="brand">scott王<small>风控策略</small></a>
    <a class="walk-back" href="../index.html#work">返回作品集</a>
  </div>
</nav>
<main class="walk">
  <p><a class="back" href="../index.html#work">返回个人主页</a></p>
  <h1>日常检视</h1>
  <p class="lede">合成示例。</p>

  <article class="finding reveal">
    <h3>观测</h3>
    <svg class="walk-spark" viewBox="0 0 148 40" role="img" aria-label="订单风险小折线，10 月抬升">
      <line x1="2" y1="34" x2="146" y2="34" stroke="#2A332D" stroke-width="1"/>
      <polyline class="spark" pathLength="1" points="2,24 22,25 42,23 62,24 82,18 102,13 122,9 144,4" fill="none" stroke="#3DDC84" stroke-width="2"/>
      <circle cx="144" cy="4" r="2.5" fill="#B7F5CE"/>
    </svg>
    <p>10 月 26 日那周对上一周。</p>
  </article>

  <article class="finding reveal">
    <h3>监控</h3>
    <p>决策、OOT 有 Swap-in、Swap-out、两边都过。上线后没有 Swap-out。</p>
    <div class="bars" aria-hidden="true">
      <div class="col">
        <div class="stack">
          <i class="bar in" style="--h:82%"></i>
          <i class="bar out" style="--h:97%"></i>
          <i class="bar both" style="--h:64%"></i>
        </div>
        <span>决策</span>
      </div>
      <div class="col">
        <div class="stack">
          <i class="bar in" style="--h:85%"></i>
          <i class="bar out" style="--h:100%"></i>
          <i class="bar both" style="--h:67%"></i>
        </div>
        <span>OOT</span>
      </div>
      <div class="col">
        <div class="stack">
          <i class="bar in" style="--h:79%"></i>
          <i class="slot"></i>
          <i class="bar both" style="--h:64%"></i>
        </div>
        <span>上线后</span>
      </div>
    </div>
    <div class="flow-legend">
      <span><i class="swatch in"></i>Swap-in</span>
      <span><i class="swatch out"></i>Swap-out</span>
      <span><i class="swatch both"></i>两边都过</span>
    </div>
  </article>
</main>
<footer>
  <div class="wrap">© 2026 scott王 · 用 AI 落地风控策略。作品集页面中的数字均为合成示例。</div>
</footer>

</body>
</html>

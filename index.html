<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>策略工具</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body class="sd-portal">
  <main class="sd-wrap">
    <h1>策略工具</h1>
    <p class="sd-lead">四个可以点的演示。打开后会载入同一份合成进件，计算留在浏览器里。页面上的数字不是真实业务。</p>
    <div class="sd-grid">
      <a class="sd-card" href="review/">
        <h2>策略复盘</h2>
        <p>看贷前通过、贷后风险，配置样本和规则后生成报告。不需要自己的 CSV。</p>
        <span>打开工作台</span>
      </a>
      <a class="sd-card" href="iterate/">
        <h2>策略迭代</h2>
        <p>用示例里的模型分和 Baseline，走目标、规则和双方案计算。</p>
        <span>打开工作台</span>
      </a>
      <a class="sd-card" href="daily/">
        <h2>日常检视</h2>
        <p>按日、周看通过率和订单风险的环比。示例载入后可以直接运行。</p>
        <span>打开检视</span>
      </a>
      <a class="sd-card" href="platform/">
        <h2>全平台检视</h2>
        <p>按平台和系统筛选，重算各月通过率。数字是编的。</p>
        <span>打开检视</span>
      </a>
    </div>
  </main>
  <script src="assets/site-nav.js"></script>
</body>
</html>
